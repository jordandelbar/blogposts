[project]
name = "fastapi-pickle"
version = "0.1.0"
description = "Adult Income Prediction API using pickle"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.6",
    "uvicorn>=0.34.0",
    "pydantic>=2.10.5",
    "scikit-learn>=1.7.2",
    "xgboost>=3.0.0,<3.1.0",
    "polars>=1.19.0",
    "gunicorn>=23.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
