[package]
name = "ort-onnx"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.7"
ort = "2.0.0-rc.10"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ndarray = "0.16"
once_cell = "1.21"
