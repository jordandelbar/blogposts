[project]
name = "fastapi-onnx"
version = "0.1.0"
description = "Adult Income Prediction API using ONNX Runtime"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.123.0",
    "gunicorn>=23.0.0",
    "numpy>=2.3.5",
    "onnxruntime>=1.23.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
